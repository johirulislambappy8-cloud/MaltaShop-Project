services:
  order-service:
    build: ./order-service
    ports:
      - "8000:8000"
    depends_on:
      - rabbitmq
      - order-db
    environment:
      DATABASE_URL: postgresql://postgres:postgres@order-db:5432/orders_db
      RABBITMQ_HOST: rabbitmq

  notification-service:
    build: ./notification-service
    ports:
      - "8001:8001"
    depends_on:
      - rabbitmq
      - notification-db
    environment:
      DATABASE_URL: postgresql://postgres:postgres@notification-db:5432/notifications_db
      RABBITMQ_HOST: rabbitmq

  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"

  order-db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: orders_db
    volumes:
      - order_data:/var/lib/postgresql/data

  notification-db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: notifications_db
    volumes:
      - notification_data:/var/lib/postgresql/data

volumes:
  order_data:
  notification_data: